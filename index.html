<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishranti Bhuvan Player</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #000; 
            overflow: hidden; /* Prevents scrolling */
        }
        #player { 
            width: 100vw; 
            height: 100vh; 
        }
    </style>
</head>
<body>
    <div id="player"></div>

    <script>
        var player;
        
        // 1. Read the video ID from the URL (e.g., ?v=1xiApA0vagJXb4pn)
        var urlParams = new URLSearchParams(window.location.search);
        //var initialVideoId = urlParams.get('v') || '';
        var initialVideoId = urlParams.get('v') || 'UHE5-qoVu28'; // Fallback video

        // 2. Load the YouTube IFrame API script
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // 3. This function is called automatically by YouTube when the API is ready
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: initialVideoId, // Use the ID from the URL
                playerVars: {
                    'playsinline': 1,       // Prevents forcing fullscreen on mobile
                    'autoplay': 0,          // 0 = wait for user to click play
                    'controls': 1,          // Show YouTube controls
                    'rel': 0,               // Don't show unrelated videos at the end
                    'enablejsapi': 1,
                    'origin': 'https://dnanetworks.github.io' // Must match your GitHub Pages domain
                },
                events: {
                    'onReady': onPlayerReady,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            console.log("YouTube Player is ready.");
            // If you want it to auto-play (though mobile might block it), uncomment:
            // event.target.playVideo();
        }

        function onPlayerError(event) {
            console.error("YouTube Player Error Code: " + event.data);
            // You could send this error back to your MAUI app later if needed
        }
    </script>
</body>
</html>
